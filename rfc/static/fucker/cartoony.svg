<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 128 128"
     aria-label="Treefucker crate icon: a cute cartoon person hip-wiggling at a tree" role="img"
     xmlns="http://www.w3.org/2000/svg">
	<title>
		treefucker
	</title>
	<desc>
		Satirical crates.io-style icon. Cute geometric mascot hugging a tree with comic motion lines. Not explicit.
	</desc>

	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#FFF3E6" />
			<stop offset="100%" stop-color="#FFD7B3" />
		</linearGradient>
		<linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#74C69D" />
			<stop offset="100%" stop-color="#2D6A4F" />
		</linearGradient>
		<linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#6F4E37" />
			<stop offset="55%" stop-color="#8B5E3C" />
			<stop offset="100%" stop-color="#5C3D2E" />
		</linearGradient>
		<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="2" flood-color="#3B1F12" flood-opacity="0.18" stdDeviation="1.4" />
		</filter>
	</defs>

	<!-- crate tile -->
	<rect x="4" y="4" rx="22" width="120" height="120"
	      fill="url(#sky)" stroke="#C2410C" stroke-width="6" />
	<rect x="10" y="10" rx="17" width="108" height="108"
	      fill="none" stroke="#F97316" stroke-width="2" opacity="0.55" />

	<!-- ground -->
	<ellipse cx="64" cy="102" rx="38" ry="7.5" fill="#E07A3A" opacity="0.28" />

	<!-- tree canopy -->
	<g filter="url(#soft)">
		<circle cx="78" cy="38" r="22" fill="url(#leaf)" />
		<circle cx="96" cy="46" r="16" fill="url(#leaf)" />
		<circle cx="62" cy="48" r="17" fill="url(#leaf)" />
		<circle cx="80" cy="56" r="14" fill="#40916C" />
	</g>

	<!-- trunk -->
	<path d="M72 58 C74 72 73 84 76 100 L88 100 C86 82 88 70 86 58 Z" fill="url(#trunk)" />
	<path d="M79 62 C80.5 74 80 86 81.5 97"
	      fill="none" stroke="#4A2F22" stroke-width="1.4" opacity="0.35" stroke-linecap="round" />

	<!-- tiny surprised knot as a wink, not a face or anatomy -->
	<ellipse cx="82.5" cy="78" rx="3.2" ry="2.4" fill="#4A2F22" opacity="0.35" />

	<!-- person: cute blob, side-ish view, hips toward trunk -->
	<g filter="url(#soft)">
		<!-- back leg -->
		<path d="M42 96 C40 88 46 86 50 90 C53 93 48 99 44 99 Z" fill="#1D4E89" />
		<!-- front leg, planted -->
		<path d="M52 98 C50 90 58 86 62 92 C64 96 60 102 54 102 Z" fill="#163A66" />
		<!-- shoes -->
		<ellipse cx="43.5" cy="100.2" rx="6.2" ry="2.3" fill="#111827" />
		<ellipse cx="55.5" cy="102" rx="6.6" ry="2.4" fill="#111827" />

		<!-- torso leaning into tree -->
		<path d="M48 70 C46 62 54 58 62 62 C70 66 72 78 66 86 C60 94 48 92 46 82 Z" fill="#EA580C" />
		<!-- hip thrust emphasis as a rounded hip bump, still clothing -->
		<ellipse cx="58" cy="82" rx="10" ry="7.5" fill="#C2410C" />

		<!-- arms hugging trunk -->
		<path d="M62 68 C70 64 78 68 82 76"
		      fill="none" stroke="#FDBA74" stroke-width="6.5" stroke-linecap="round" />
		<path d="M64 74 C72 72 78 76 81 82"
		      fill="none" stroke="#FDBA74" stroke-width="5.5" stroke-linecap="round" />

		<!-- head -->
		<circle cx="46" cy="56" r="13.5" fill="#FEC7A3" />
		<!-- hair tuft -->
		<path d="M36 52 C36 42 48 40 54 46 C48 44 40 46 36 52 Z" fill="#1F2937" />
		<!-- blush -->
		<ellipse cx="41.5" cy="59" rx="3.1" ry="1.6" fill="#FB7185" opacity="0.55" />
		<ellipse cx="52.5" cy="59.5" rx="2.6" ry="1.4" fill="#FB7185" opacity="0.4" />
		<!-- eye -->
		<circle cx="50.5" cy="55.5" r="2.1" fill="#111827" />
		<circle cx="51.2" cy="54.8" r="0.7" fill="#fff" />
		<!-- grin -->
		<path d="M48 61 Q51 64 54 61"
		      fill="none" stroke="#9A3412" stroke-width="1.4" stroke-linecap="round" />
	</g>

	<!-- comic hip-wiggle lines, not anatomy -->
	<g fill="none" stroke="#C2410C" stroke-width="2.2" opacity="0.85" stroke-linecap="round">
		<path d="M34 80 C30 78 28 82 31 84" />
		<path d="M32 86 C27 85 26 90 30 91" />
		<path d="M36 74 C32 71 30 75 33 77" />
	</g>
	<g fill="none" stroke="#F97316" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
		<path d="M38 88 l-6 3" />
		<path d="M37 93 l-5 4" />
	</g>

	<!-- tiny sparkles: satire, not smut -->
	<g fill="#F59E0B">
		<path d="M28 44 l1.4 3.4 3.4 1.4 -3.4 1.4 -1.4 3.4 -1.4 -3.4 -3.4 -1.4 3.4 -1.4 z" />
		<path d="M104 28 l1.1 2.6 2.6 1.1 -2.6 1.1 -1.1 2.6 -1.1 -2.6 -2.6 -1.1 2.6 -1.1 z" />
	</g>

	<!-- crate badge corner -->
	<path d="M92 16 h16 a4 4 0 0 1 4 4 v16 z" fill="#EA580C" />
	<path d="M96 22 h10 M96 26 h10 M96 30 h7"
	      stroke="#FFEDD5" stroke-width="1.6" stroke-linecap="round" />
</svg>
