<svg viewBox="0 0 64 64" aria-labelledby="title desc" role="img" xmlns="http://www.w3.org/2000/svg">
	<title id="title">
		Treefucker satirical icon
	</title>
	<desc id="desc">
		A cute stick figure doing an exaggerated hip-thrusting pose toward a tree.
	</desc>

	<!-- soft ground -->
	<path d="M7 55.5H57"
	      fill="none" stroke="currentColor" stroke-width="3" opacity=".18" stroke-linecap="round" />

	<!-- tree -->
	<path d="M43 17v38" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" />
	<path d="M43 22c-7 0-10-4-10-8 5 0 8 1 10 4 2-5 6-7 11-7 0 5-3 9-11 11Z"
	      fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />

	<!-- head -->
	<circle cx="20" cy="22" r="5" fill="none" stroke="currentColor" stroke-width="3" />

	<!-- body / arms -->
	<path d="M23 27c4 3 6 7 7 12
	         M24 31l10 3
	         M17 28l-2 11"
	      fill="none"
	      stroke="currentColor"
	      stroke-width="3.5"
	      stroke-linecap="round"
	      stroke-linejoin="round" />

	<!-- hips / legs: deliberately cartoonish and clothed-looking -->
	<path d="M30 39c5-2 8-1 11 1
	         M31 40l-6 12
	         M39 40l-1 12"
	      fill="none"
	      stroke="currentColor"
	      stroke-width="4"
	      stroke-linecap="round"
	      stroke-linejoin="round" />

	<!-- hip thrust motion lines -->
	<path d="M28 36l-5-2
	         M28 41l-6 1"
	      fill="none"
	      stroke="currentColor"
	      stroke-width="2.5"
	      stroke-linecap="round" />

	<!-- tiny comic impact marks near tree, no anatomy/contact detail -->
	<path d="M37 35l-3-2
	         M37 39h-4"
	      fill="none"
	      stroke="currentColor"
	      stroke-width="2.5"
	      stroke-linecap="round" />

	<!-- cute little face -->
	<circle cx="18.5" cy="21" r="0.8" fill="currentColor" />
	<circle cx="21.5" cy="21" r="0.8" fill="currentColor" />
	<path d="M18.5 24c1 .9 2.1.9 3 0"
	      fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
</svg>
