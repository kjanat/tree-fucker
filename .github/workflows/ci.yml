---
name: CI
on:
  push:
    branches: [master]
    paths-ignore: [rfc/**, reports/**, "*.txt", .zed/**, .github/workflows/pages.yml]
  pull_request:
    paths-ignore: [rfc/**, reports/**, "*.txt", .zed/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: "${{ github.event_name == 'pull_request' }}" }
env:
  CARGO_TERM_COLOR: always
  CARGO_UNSTABLE_HINT_MSRV: "false"
  RUSTDOCFLAGS: -D warnings

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, macos-26-intel, windows-2025, windows-11-arm] }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: "rustfmt, clippy, rust-src, rust-analyzer" }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.event_name != 'pull_request' }}" }
      - name: Prepare macOS coordination storage
        if: startsWith(matrix.os, 'macos-')
        run: |
          sudo mkdir -p /var/run/tree-fucker
          sudo /sbin/mount_tmpfs -e -s 128m /var/run/tree-fucker
          sudo chmod 1777 /var/run/tree-fucker
      - if: matrix.os == 'ubuntu-26.04'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --no-fail-fast
      - name: Layer probe correctness
        run: cargo bench:layers --test;
          cargo bench:alloc --test
      - name: Coordination protocol benchmark smoke test
        run: cargo bench --bench coordination -- --test
      - name: Coordination namespace acceptance
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          cargo test --test coordination_namespaces --no-run --message-format=json > target/namespace-build.jsonl
          test_executable=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "coordination_namespaces") | .executable // empty' target/namespace-build.jsonl)
          sudo install -d -m 755 "${RUNNER_TEMP}/coordination-namespaces"
          sudo install -m 755 "${test_executable}" "${RUNNER_TEMP}/coordination-namespaces/coordination_namespaces"
          sudo "${RUNNER_TEMP}/coordination-namespaces/coordination_namespaces" namespace_histories --ignored --nocapture
      - name: Coordination process benchmark smoke tests
        if: startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-')
        run: |
          cargo bench --bench coordination_processes -- --test
          cargo bench --bench coordination_processes_alloc -- --test
      - name: macOS coordination root acceptance
        if: startsWith(matrix.os, 'macos-')
        run: |
          cargo test --test coordination_macos --no-run --message-format=json > target/macos-coordination-build.jsonl
          test_executable=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "coordination_macos") | .executable // empty' target/macos-coordination-build.jsonl)
          sudo "${test_executable}" privileged_ --ignored --nocapture
      - run: cargo doc --no-deps --all-features

  freebsd:
    name: freebsd-15
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          envs: CARGO_TERM_COLOR CARGO_UNSTABLE_HINT_MSRV RUSTDOCFLAGS
          copyback: false
          prepare: |
            mkdir -p /var/run/tree-fucker
            mount -t tmpfs -o mode=1777 tmpfs /var/run/tree-fucker
            pkg install -y curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly -c rustfmt -c clippy -c rust-src -c rust-analyzer
          run: |
            set -e
            . "$HOME/.cargo/env"
            cargo clippy --all-targets --all-features -- -D warnings
            cargo test --all-features --no-fail-fast
            cargo test --test coordination_freebsd privileged_ -- --ignored
            cargo bench --bench coordination -- --test
            cargo bench --bench coordination_processes -- --test
            cargo bench --bench coordination_processes_alloc -- --test
            cargo doc --no-deps --all-features

  illumos:
    name: omnios-r151058
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: vmactions/omnios-vm@v1
        with:
          release: r151058-build
          envs: CARGO_TERM_COLOR CARGO_UNSTABLE_HINT_MSRV RUSTDOCFLAGS
          copyback: false
          prepare: |
            mkdir -p /var/run/tree-fucker
            chmod 1777 /var/run/tree-fucker
            pkg install build-essential curl || [ $? -eq 4 ]
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly -c rustfmt -c clippy -c rust-src -c rust-analyzer
          run: |
            set -e
            . "$HOME/.cargo/env"
            sh benchmarks/omnios_zone.sh
            cargo clippy --all-targets --all-features -- -D warnings
            cargo test --all-features --no-fail-fast
            cargo test --test coordination_illumos privileged_ -- --ignored
            cargo bench --bench coordination -- --test
            cargo bench --bench coordination_processes -- --test
            cargo bench --bench coordination_processes_alloc -- --test
            cargo doc --no-deps --all-features

  cross:
    name: clippy ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: { target: [x86_64-pc-solaris, aarch64-unknown-freebsd, loongarch64-unknown-linux-musl] }
    env: { TARGET: "${{ matrix.target }}" }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: clippy, targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}", save-if: "${{ github.event_name != 'pull_request' }}" }
      - run: cargo clippy --target "${TARGET}" --all-targets --all-features -- -D warnings
