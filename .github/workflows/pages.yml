---
name: Pages
on:
  push:
    branches: [master]
    paths: [rfc/**, src/**, Cargo.*, .cargo/config.toml, .github/workflows/pages.yml]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
defaults: { run: { working-directory: rfc } }
env:
  CARGO_TERM_COLOR: always
  CARGO_UNSTABLE_HINT_MSRV: "false"
  RUSTDOCFLAGS: -D warnings
  SITE_REQUIRE_API: "1"

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - parallel:
          - uses: oven-sh/setup-bun@v2
          - uses: kjanat/dprint-check@v3
            with: { install-only: true }
          - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun run site
      - uses: actions/upload-pages-artifact@v5
        with: { path: rfc/_site }

  deploy:
    needs: build
    runs-on: ubuntu-slim
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps: [{ id: deployment, uses: actions/deploy-pages@v5 }]
