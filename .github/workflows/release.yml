---
name: Publish release
run-name: ${{ inputs.beepboop_title || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Promotion execution approved in Beepboop
        required: true
        type: string
      beepboop_title:
        description: Run title sent by Beepboop
        required: false
        type: string
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
concurrency: { group: release-publish, cancel-in-progress: false }

jobs:
  authorize:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: { contents: read, actions: read, id-token: write }
    outputs:
      context: ${{ steps.release.outputs.context }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: kjanat/beepboop/actions/begin@v1
        id: release
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          operation: promote
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Fetch the approved source commit
        env:
          SOURCE_SHA: ${{ fromJSON(steps.release.outputs.context).sourceSha }}
        run: git fetch --no-tags --depth=1 origin "${SOURCE_SHA}"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --production --filter release
      - name: Require the approved version, signed commit, and successful CI
        env:
          RELEASE_CONTEXT: ${{ steps.release.outputs.context }}
        run: bun .github/actions/release/release.ts check

  package:
    needs: authorize
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.authorize.outputs.context).sourceSha }}
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: cargo package --locked
      - run: cargo publish --dry-run --locked
      - run: cargo publish --dry-run --locked --features tokio

  publish:
    needs: [authorize, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions: { contents: read, actions: read, id-token: write, attestations: write }
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_CONTEXT: ${{ needs.authorize.outputs.context }}
      BEEPBOOP_EXECUTION_ID: ${{ inputs.beepboop_execution_id }}
      RELEASE_TOOL: ${{ github.workspace }}/.github/actions/release/release.ts
    defaults:
      run: { working-directory: source }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Fetch the approved source commit for the version tag
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ fromJSON(needs.authorize.outputs.context).sourceSha }}
        run: git fetch --no-tags --depth=1 origin "${SOURCE_SHA}"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --production --filter release
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.authorize.outputs.context).sourceSha }}
          path: source
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - name: Package the approved commit without building it
        run: cargo package --no-verify --locked
      - name: Recheck the approved commit and CI
        run: bun "${RELEASE_TOOL}" check
      - name: Check publication identity and retry state
        id: candidate
        run: bun "${RELEASE_TOOL}" candidate
      - uses: kjanat/beepboop/actions/credentials@v1
        if: steps.candidate.outputs.publish == 'true'
        id: credentials
        with:
          aliases: '["crates-io"]'
      - name: Publish the crate
        if: steps.candidate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ fromJSON(steps.credentials.outputs.values)['crates-io'] }}
        run: cargo publish --no-verify --locked
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: source/target/package/*.crate
      - name: Verify the registry checksum
        id: crate
        run: bun "${RELEASE_TOOL}" crate-report
      - uses: kjanat/beepboop/actions/report@v1
        with:
          publications: ${{ steps.crate.outputs.publications }}
      - name: Obtain the Beepboop App identity and repository token
        uses: kjanat/beepboop/actions/token@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          permissions: '{"contents":"write"}'
      - name: Attach the crate to the draft release
        env:
          GH_TOKEN: ${{ steps.beepboop.outputs.token }}
          RELEASE_ID: ${{ fromJSON(needs.authorize.outputs.context).draftRelease.id }}
          ASSET: tree-fucker-${{ fromJSON(needs.authorize.outputs.context).version }}.crate
        run: |
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name == \"${ASSET}\") | .id")
          if [ -n "${existing}" ]; then gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${existing}"; fi
          gh api --method POST --header "Content-Type: application/octet-stream" --input "target/package/${ASSET}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET}"
      - uses: kjanat/beepboop/actions/publish-refs@v1
        env:
          "${{ insert }}": ${{ fromJSON(steps.beepboop.outputs.gitId || '{}') }}
        with:
          token: ${{ steps.beepboop.outputs.token }}
      - uses: kjanat/beepboop/actions/publish-release@v1
