---
name: Publish release
run-name: Release operation ${{ inputs.beepboop_execution_id }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Promotion execution approved in Beepboop
        required: true
        type: string
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
concurrency: { group: release-publish, cancel-in-progress: false }

jobs:
  authorize:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: { contents: read, actions: read, id-token: write }
    outputs:
      context: ${{ steps.release.outputs.context }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: kjanat/beepboop/actions/begin@dcfd2f7ff3525ec54582b32c737b44a5cc47147b
        id: release
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          operation: promote
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Fetch the approved source commit
        env:
          SOURCE_SHA: ${{ fromJSON(steps.release.outputs.context).sourceSha }}
        run: git fetch --no-tags --depth=1 origin "${SOURCE_SHA}"
      - name: Require the approved version, signed commit, and successful CI
        env:
          RELEASE_CONTEXT: ${{ steps.release.outputs.context }}
        run: python3 -I scripts/release.py check

  package:
    needs: authorize
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.authorize.outputs.context).sourceSha }}
          persist-credentials: false
      - name: Install Rust toolchains
        run: rustup toolchain install nightly stable 1.99.1 --profile minimal --no-self-update
      - name: Verify the release archive and stable consumers
        run: python3 tests/package/verify.py --toolchain stable
      - name: Verify release-baseline consumers
        run: python3 tests/package/verify.py --toolchain 1.99.1 --archive target/package/tree-fucker-*.crate
      - uses: actions/upload-artifact@v7
        with:
          name: release-crate
          path: |
            target/package/*.crate
            target/package/files.txt
          if-no-files-found: error

  publish:
    needs: [authorize, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { contents: write, actions: read, id-token: write }
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_CONTEXT: ${{ needs.authorize.outputs.context }}
      BEEPBOOP_EXECUTION_ID: ${{ inputs.beepboop_execution_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Fetch the approved source commit
        env:
          SOURCE_SHA: ${{ fromJSON(needs.authorize.outputs.context).sourceSha }}
        run: git fetch --no-tags --depth=1 origin "${SOURCE_SHA}"
      - uses: actions/download-artifact@v8
        with:
          name: release-crate
          path: target/package
      - name: Recheck the approved commit and CI
        run: python3 -I scripts/release.py check
      - name: Check publication identity and retry state
        id: candidate
        run: python3 -I scripts/release.py candidate
      - uses: kjanat/beepboop/actions/credentials@dcfd2f7ff3525ec54582b32c737b44a5cc47147b
        if: steps.candidate.outputs.publish == 'true'
        id: credentials
        with:
          aliases: '["crates-io"]'
      - name: Publish the verified crate
        if: steps.candidate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ fromJSON(steps.credentials.outputs.values)['crates-io'] }}
        run: python3 -I scripts/release.py publish
      - name: Verify the registry checksum
        id: crate
        run: python3 -I scripts/release.py crate-report
      - uses: kjanat/beepboop/actions/report@dcfd2f7ff3525ec54582b32c737b44a5cc47147b
        with:
          publications: ${{ steps.crate.outputs.publications }}
      - name: Set annotated-tag identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: kjanat/beepboop/actions/publish-refs@dcfd2f7ff3525ec54582b32c737b44a5cc47147b
        with:
          token: ${{ github.token }}
      - name: Create the GitHub release
        if: steps.candidate.outputs.github-release == 'false'
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
          SOURCE_SHA: ${{ fromJSON(needs.authorize.outputs.context).sourceSha }}
          PRERELEASE: "${{ case(steps.candidate.outputs.prerelease == 'true', '--prerelease', '') }}"
        run: gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag
          --target "${SOURCE_SHA}" --title "${TAG}" --generate-notes ${{ env.PRERELEASE }}
      - name: Verify the published release and tag
        id: github
        run: python3 -I scripts/release.py github-report
      - uses: kjanat/beepboop/actions/report@dcfd2f7ff3525ec54582b32c737b44a5cc47147b
        with:
          publications: ${{ steps.github.outputs.publications }}
