---
name: Prepare release
run-name: Release operation ${{ inputs.beepboop_execution_id }}
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Execution created by Beepboop
        required: true
        type: string
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
concurrency: { group: release-prepare, cancel-in-progress: false }

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions: { contents: read, id-token: write }
    steps:
      - uses: kjanat/beepboop/actions/begin@dcfd2f7ff3525ec54582b32c737b44a5cc47147b
        id: release
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          operation: prepare
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.context).sourceSha }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: kjanat/beepboop/actions/prepare@dcfd2f7ff3525ec54582b32c737b44a5cc47147b
        with:
          context: ${{ steps.release.outputs.context }}
          mode: apply
      - name: Refresh the package lockfile and check all targets
        run: cargo check --all-targets --all-features
      - uses: kjanat/beepboop/actions/prepare@dcfd2f7ff3525ec54582b32c737b44a5cc47147b
        with:
          context: ${{ steps.release.outputs.context }}
          mode: submit
