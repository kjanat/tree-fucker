[package]
name          = "tree-fucker"
version       = "0.1.0"
authors       = ["Kaj Kowalski"]
edition       = "2024"
rust-version  = "1.99.1"
description   = "Resource-governed filesystem scans and immutable, reconciled tree snapshots"
documentation = "https://docs.rs/tree-fucker"
readme        = "README.md"
homepage      = "https://tree-fucker.kjanat.dev/"
repository    = "https://github.com/kjanat/tree-fucker"
license       = "MIT OR Apache-2.0"
keywords      = ["directory", "filesystem", "resource-limits", "snapshot", "traversal"]
categories    = ["asynchronous", "concurrency", "filesystem"]
include       = [
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/benches/**",
  "/benchmarks/baselines/fsql/*.rs",
  "/rfc/*.md",
  "/rfc/*.txt",
  "/README.md",
  "/LICENSE*",
  "/CHANGELOG.md",
  "/Cargo.toml",
  "/Cargo.lock"
]

[package.metadata.docs.rs]
all-features = true

[workspace]
[workspace.lints]
cargo   = { implicit_features = "warn" }
clippy  = {}
rust    = {}
rustdoc = { all = "deny" }

[[example]]
name              = "tree"
required-features = ["tokio"]

[[bench]]
harness = false
name    = "layers"

[[bench]]
harness = false
name    = "layers_alloc"

[[bench]]
harness = false
name    = "coordination"

[[bench]]
harness = false
name    = "coordination_processes"

[[bench]]
harness = false
name    = "coordination_processes_alloc"

[dependencies]
futures-channel = "0.3.34"
futures-core    = "0.3.34"
futures-util    = "0.3.34"
imbl            = "7.0.2"

[dependencies.tokio]
version  = "1.54.1"
features = ["rt", "time"]
optional = true

[dev-dependencies]
futures-executor = "0.3.34"
stats_alloc      = "0.1.10"
tempfile         = "3.27.0"
tokio            = { version = "1.54.1", features = ["macros", "rt", "time"] }

[target."cfg(any(unix, windows))".dependencies]
getrandom = { version = "0.4.3", features = ["std"] }

[target."cfg(unix)".dependencies]
libc   = "0.2.189"
rustix = { version = "1.1.4", features = ["fs", "process", "time"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_SystemInformation",
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Kernel",
  "Win32_System_Performance",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell"
] }

[features]
tokio = ["dep:tokio"]

[lints]
workspace = true
